<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <title>Login | Deuce Pages</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/theme-tokens.css">
    <link rel="stylesheet" href="/access.css">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-label="Login">
        <form id="loginForm" class="auth-form">
          <label class="auth-field">
            <span>Email</span>
            <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
          </label>
          <button class="auth-submit" type="submit">Login</button>
        </form>
        <p id="formError" class="auth-error" role="alert" hidden></p>
      </section>
    </main>
    <script src="/public-errors.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
