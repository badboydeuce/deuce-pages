<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <title>Login | Deuce Pages</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/access.css">
  </head>
  <body class="login-only">
    <div class="noise" aria-hidden="true"></div>
    <main class="access-layout">
      <section class="access-panel" aria-label="Login">
        <form id="loginForm" class="access-form">
          <label>Email<input id="loginEmail" type="email" autocomplete="email" required></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <button type="submit">Login</button>
        </form>
        <p id="formError" class="form-error" role="alert" hidden></p>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
