<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <title>DEUCE | Access</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/theme-tokens.css">
    <link rel="stylesheet" href="/blog/blog.css">
  </head>
  <body>
    <div class="room-noise" aria-hidden="true"></div>
    <div class="room-grid" aria-hidden="true"></div>

    <header class="brand-bar">
      <a class="brand" href="/blog/" aria-label="DEUCE home">
        <span class="brand-mark">D2</span>
        <span class="brand-name">DEUCE</span>
      </a>
      <span class="power-state" aria-hidden="true"><i></i><i></i><i></i></span>
    </header>

    <main id="accessScene" class="access-scene">
      <div class="room-glow" aria-hidden="true"></div>
      <div class="horizon" aria-hidden="true"></div>
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>

      <section class="lamp-rig" aria-label="Light control">
        <div class="power-cable" aria-hidden="true"></div>
        <div class="lamp-body" aria-hidden="true">
          <span class="socket"><i></i><i></i><i></i></span>
          <span class="bulb"><i class="filament"></i></span>
          <span class="light-cone"></span>
        </div>
        <button
          id="pullCord"
          class="pull-control"
          type="button"
          aria-label="Pull the cord to reveal member login"
          aria-controls="memberLogin"
          aria-pressed="false"
        >
          <span class="chain-line" aria-hidden="true"></span>
          <span class="chain-handle" aria-hidden="true"><i></i></span>
        </button>
      </section>

      <section id="memberLogin" class="login-stage" aria-label="Member login" aria-hidden="true" inert>
        <div class="stage-rail stage-rail-left" aria-hidden="true"></div>
        <div class="stage-rail stage-rail-right" aria-hidden="true"></div>
        <div class="login-card">
          <div class="card-cap" aria-hidden="true">
            <span class="mini-mark">D2</span>
            <span class="cap-dots"><i></i><i></i><i></i></span>
          </div>
          <form id="loginForm" class="login-form">
            <label>
              <span>Email</span>
              <input id="loginEmail" type="email" autocomplete="email" inputmode="email" required>
            </label>
            <label>
              <span>Password</span>
              <input id="loginPassword" type="password" autocomplete="current-password" required>
            </label>
            <button class="login-submit" type="submit">
              <span>Enter</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
          </form>
          <p id="formError" class="form-error" role="alert" hidden></p>
        </div>
        <div class="stage-base" aria-hidden="true"><i></i><i></i><i></i></div>
      </section>
    </main>

    <script src="/public-errors.js"></script>
    <script src="/blog/blog.js"></script>
  </body>
</html>
